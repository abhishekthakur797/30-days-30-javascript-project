<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="shortcut icon" href="img/generate.png" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Generate a <br /><span>Random Password</span></h1>
      <div class="input-box">
        <input type="text" id="password" placeholder="Password" readonly aria-label="Generated password" />
        <button id="copyBtn" class="icon-btn" title="Copy password">
          <img src="img/copy.png" alt="Copy" />
        </button>
      </div>
      <p id="message"></p>
      <button id="generateBtn" class="generate-btn">
        <img src="img/generate.png" alt="" />Generate Password
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
