<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body
    class="flex min-h-screen items-center justify-center bg-gradient-to-tl from-[#15803d] via-[#115e59] to-[#164e63] p-4 text-white"
  >
    <div class="w-full max-w-xs rounded-2xl bg-gray-800 p-5 shadow-2xl">
      <input
        id="display"
        type="text"
        readonly
        aria-label="Result"
        class="mb-4 w-full rounded-lg bg-gray-900/60 px-4 py-5 text-right text-3xl font-bold outline-none"
      />

      <!-- .key / .op styles live in src/input.css. data-value is the character added to the display. -->
      <div id="keys" class="grid grid-cols-4 gap-3 text-xl">
        <button class="key op" data-action="clear">AC</button>
        <button class="key op" data-action="delete">DE</button>
        <button class="key op" data-value=".">.</button>
        <button class="key op" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key op" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key op" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key op" data-value="+">+</button>

        <button class="key" data-value="00">00</button>
        <button class="key" data-value="0">0</button>
        <button class="key col-span-2 bg-blue-600 hover:bg-blue-700" data-action="equals">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
