<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="shortcut icon" href="img/drizzle.png" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <!-- Search bar -->
      <form class="search">
        <input type="text" placeholder="Enter city name" spellcheck="false" aria-label="City name" />
        <button type="submit" aria-label="Search"><img src="img/search.png" alt="" /></button>
      </form>

      <p class="error"></p>

      <!-- Weather details (hidden until a search succeeds) -->
      <div class="weather">
        <img src="img/rain.png" alt="" class="weather-icon" />
        <h1 class="temp">0°C</h1>
        <h2 class="city">Unknown City</h2>

        <div class="details">
          <div class="col">
            <img src="img/humidity.png" alt="" />
            <div>
              <p class="humidity">N/A</p>
              <p>Humidity</p>
            </div>
          </div>
          <div class="col">
            <img src="img/wind.png" alt="" />
            <div>
              <p class="wind">N/A</p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
