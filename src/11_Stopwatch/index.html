<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
      integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body class="flex min-h-screen items-center justify-center bg-gradient-to-r from-slate-900 to-slate-700 text-white">
    <div class="flex flex-col items-center gap-10 rounded-2xl bg-white/5 px-10 py-12 shadow-2xl sm:px-16">
      <h1 id="displayTime" class="font-mono text-5xl font-bold tabular-nums sm:text-6xl">00 : 00 : 00</h1>

      <div class="flex items-center gap-6">
        <button
          id="stop"
          aria-label="Stop"
          class="flex h-16 w-16 items-center justify-center rounded-full border border-white text-xl transition hover:bg-white/20"
        >
          <i class="fa-solid fa-stop"></i>
        </button>
        <button
          id="start"
          aria-label="Start"
          class="flex h-24 w-24 items-center justify-center rounded-full bg-blue-600 text-3xl shadow-lg transition hover:bg-blue-700"
        >
          <i class="fa-solid fa-play"></i>
        </button>
        <button
          id="reset"
          aria-label="Reset"
          class="flex h-16 w-16 items-center justify-center rounded-full border border-white text-xl transition hover:bg-white/20"
        >
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
