<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>30 Days 30 JavaScript Projects</title>
    <link rel="shortcut icon" href="img/icons8-javascript-144.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
      integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="src/output.css" />
    <script>
      // Apply the saved theme before the page paints to avoid a flash.
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body
    class="flex min-h-screen flex-col bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100"
  >
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-purple-600 text-white shadow-md">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-3">
        <a href="#" aria-label="Home">
          <i class="fa-brands fa-js text-4xl text-yellow-400 hover:text-yellow-300"></i>
        </a>

        <ul class="hidden gap-8 text-lg font-semibold md:flex">
          <li><a class="hover:text-yellow-300" href="#">Home</a></li>
          <li><a class="hover:text-yellow-300" href="https://tinyurl.com/abhishek-protfolio">Portfolio</a></li>
          <li><a class="hover:text-yellow-300" href="https://github.com/abhishekthakur797/30-days-30-javascript-project">GitHub</a></li>
        </ul>

        <div class="flex items-center gap-5 text-2xl">
          <button id="theme-toggle" aria-label="Toggle dark mode">
            <i class="fa-regular fa-moon"></i>
          </button>
          <button id="menu-toggle" class="md:hidden" aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </div>

      <!-- Mobile menu -->
      <ul
        id="mobile-menu"
        class="hidden flex-col gap-4 border-t border-purple-500 py-4 text-center text-lg font-semibold md:hidden"
      >
        <li><a class="hover:text-yellow-300" href="#">Home</a></li>
        <li><a class="hover:text-yellow-300" href="https://tinyurl.com/abhishek-protfolio">Portfolio</a></li>
        <li><a class="hover:text-yellow-300" href="https://github.com/abhishekthakur797/30-days-30-javascript-project">GitHub</a></li>
      </ul>
    </nav>

    <!-- Main -->
    <main class="mx-auto w-full max-w-6xl flex-1 px-6 py-12">
      <header class="mb-10 text-center">
        <h1 class="text-4xl font-bold md:text-5xl">
          30 Days <span class="text-purple-600 dark:text-purple-400">30 JavaScript</span> Projects
        </h1>
        <p class="mt-3 text-slate-600 dark:text-slate-400">
          Small projects built with HTML, CSS, Tailwind and vanilla JavaScript.
        </p>
      </header>

      <div id="projects" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-gradient-to-bl from-[#0f172a] via-[#1e1a78] to-[#0f172a] py-4 text-white">
      <div class="flex flex-col items-center gap-1 text-sm">
        <p>© <span id="year"></span> Abhishek. All rights reserved.</p>
        <p id="clock"></p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
